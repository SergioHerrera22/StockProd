name: Deploy to Hostinger

on:
  push:
    branches: [main, master]
  workflow_dispatch:

env:
  NODE_VERSION: '20.x'
  BACKEND_DIR: './backend'
  FRONTEND_DIR: './frontend'

jobs:
  # ============================================
  # LINT & TYPE CHECK
  # ============================================
  lint-and-typecheck:
    name: Lint & Type Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install backend dependencies
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm ci

      - name: Install frontend dependencies
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npm ci

      - name: Type check backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npx tsc --noEmit

      - name: Type check frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        run: npx tsc --noEmit

  # ============================================
  # TESTS
  # ============================================
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    needs: lint-and-typecheck

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Run backend smoke tests
        working-directory: ${{ env.BACKEND_DIR }}
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/robles_stock_test
          PGPASSWORD: postgres
          JWT_SECRET: test-secret-key-for-testing-only-do-not-use-in-production
          NODE_ENV: test
          SEED_ADMIN_PASSWORD: robles2026
        run: |
          set -euo pipefail

          sudo systemctl start postgresql
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "ALTER USER postgres WITH PASSWORD 'postgres';"

          psql -h localhost -U postgres -v ON_ERROR_STOP=1 -c "CREATE DATABASE robles_stock_test;"
          npm run db:migrate
          npm run db:seed

          npm run build
          nohup npm start > /tmp/robles-stock-api.log 2>&1 &
          API_PID=$!
          trap 'kill "$API_PID" 2>/dev/null || true' EXIT

          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:4000/api/health | grep -q '"db":"ok"'; then
              echo "API disponible y PostgreSQL saludable."
              break
            fi

            if ! kill -0 "$API_PID" 2>/dev/null; then
              echo "La API terminó antes de estar disponible."
              cat /tmp/robles-stock-api.log
              exit 1
            fi

            if [ "$attempt" -eq 30 ]; then
              echo "La API no respondió al health check dentro de 60 segundos."
              cat /tmp/robles-stock-api.log
              exit 1
            fi

            sleep 2
          done

          npm run test:smoke

  # ============================================
  # BUILD
  # ============================================
  build:
    name: Build Application
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            backend/package-lock.json
            frontend/package-lock.json

      - name: Install dependencies
        run: |
          npm ci
          npm ci --prefix backend
          npm ci --prefix frontend

      - name: Build backend
        working-directory: ${{ env.BACKEND_DIR }}
        run: npm run build

      - name: Build frontend
        working-directory: ${{ env.FRONTEND_DIR }}
        env:
          VITE_API_URL: /api
        run: npm run build

      - name: Upload backend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/
          retention-days: 1

      - name: Upload frontend build artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/
          retention-days: 1

      - name: Upload package.json files
        uses: actions/upload-artifact@v4
        with:
          name: package-files
          path: |
            backend/package.json
            backend/package-lock.json
          retention-days: 1

  # ============================================
  # DEPLOY TO HOSTINGER
  # ============================================
  deploy:
    name: Deploy to Hostinger
    runs-on: ubuntu-latest
    needs: build

    # Permite acceder a los secretos del Environment de Hostinger.
    environment: HOSTINGER_FTP_HOST

    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'

    env:
      HOSTINGER_SSH_HOST: ${{ secrets.HOSTINGER_SSH_HOST }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download backend build artifact
        uses: actions/download-artifact@v4
        with:
          name: backend-dist
          path: backend/dist/

      - name: Download frontend build artifact
        uses: actions/download-artifact@v4
        with:
          name: frontend-dist
          path: frontend/dist/

      - name: Prepare frontend for deployment
        run: |
          mkdir -p public
          cp -a frontend/dist/. public/
          test -f public/index.html
          test -d public/assets

      - name: Download package files
        uses: actions/download-artifact@v4
        with:
          name: package-files
          path: backend/

      - name: Create backend .env file
        run: |
          cat > backend/.env << 'EOF'
          ${{ secrets.HOSTINGER_BACKEND_ENV }}
          EOF

      - name: Create frontend .env file
        run: |
          cat > frontend/.env << 'EOF'
          ${{ secrets.HOSTINGER_FRONTEND_ENV }}
          EOF

      - name: Validate deployment bundle
        run: |
          set -euo pipefail
          test -s backend/dist/index.js
          test -s backend/package.json
          test -s backend/package-lock.json
          test -s backend/scripts/migrate.mjs
          test -d backend/migrations
          test -s backend/.env
          test -s public/index.html
          test -d public/assets

      - name: Deploy to Hostinger via SFTP (SSH)
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          source: "backend/dist/**,backend/package.json,backend/package-lock.json,backend/migrations/**,backend/scripts/**,backend/.env,public/**"
          target: "/home/u843286633/domains/stock.roblespinturerias.com/hbuilds/current/nodejs"
          strip_components: 0
          overwrite: true
          timeout: 2m
          command_timeout: 10m

      - name: Run database migrations on Hostinger (via SSH)
        if: ${{ env.HOSTINGER_SSH_HOST != '' }}
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_SSH_HOST }}
          username: ${{ secrets.HOSTINGER_SSH_USER }}
          key: ${{ secrets.HOSTINGER_SSH_KEY }}
          port: ${{ secrets.HOSTINGER_SSH_PORT }}
          script_stop: true
          command_timeout: 10m
          script: |
            set -eu

            BASE="/home/u843286633/domains/stock.roblespinturerias.com/hbuilds"
            NODE="/opt/alt/alt-nodejs20/root/usr/bin/node"
            ENV_FILE="$BASE/config/.env"
            NODE_MODULES="$BASE/current/nodejs/node_modules"

            echo "Verificando entorno de producción..."

            test -x "$NODE"
            test -r "$ENV_FILE"
            test -f "$BASE/current/nodejs/backend/scripts/migrate.mjs"
            test -f "$BASE/current/nodejs/backend/migrations/034_merchandise_request_warehouse_observation.sql"
            test -f "$BASE/current/nodejs/backend/migrations/035_merchandise_request_missing_quantity.sql"

            echo "Node:"
            "$NODE" --version

            cd "$BASE/current/nodejs/backend"

            export DOTENV_CONFIG_PATH="$ENV_FILE"

            echo "Ejecutando migraciones con la configuración de Hostinger..."
            "$NODE" -r "$NODE_MODULES/dotenv/config.js" scripts/migrate.mjs

            echo "Migraciones ejecutadas correctamente."

      - name: Notify deployment success
        if: success()
        run: |
          echo "Despliegue completado exitosamente en Hostinger"
          echo "Verificar disponibilidad de la aplicación."

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "El despliegue falló. Revisar los logs."
          exit 1
